<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacman</title>
    <script type="module" src="/src/app.js"></script>
</head>
<body>
    <div id="darken"></div>
    <div id="promptAnchor"><div id="prompt" class="framed"><div id="promptContent"></div><div id="promptClose" class="close" style="display:none;">x</div></div></div>

    <main class="game-shell">
        <header class="hud" aria-label="Game status">
            <div class="hud-item">
                <span class="hud-label">Score</span>
                <span id="score" class="hud-value">0</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">High Score</span>
                <span id="highScore" class="hud-value">0</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">Level</span>
                <span id="level" class="hud-value">1</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">Lives</span>
                <span id="lives" class="hud-value">3</span>
            </div>
            <div class="hud-item hud-item-wide">
                <span class="hud-label">Powerups</span>
                <span id="powerUps" class="hud-value">0 active / 0 left</span>
            </div>
        </header>

        <section class="game-board" aria-label="Pacman grid">
            <canvas id="TheGame"></canvas>
            <div id="introHud" class="intro-hud" role="dialog" aria-modal="true" aria-labelledby="introTitle">
                <div id="introTitlePanel" class="intro-panel intro-title-panel">
                    <div class="intro-marquee" aria-hidden="true">
                        <span class="intro-pacman"></span>
                        <span class="intro-dot"></span>
                        <span class="intro-dot"></span>
                        <span class="intro-dot"></span>
                        <span class="intro-ghost intro-ghost-red"></span>
                        <span class="intro-ghost intro-ghost-cyan"></span>
                    </div>
                    <p class="intro-kicker">Ready for the maze?</p>
                    <h1 id="introTitle" class="intro-title">PACMAN</h1>
                    <button id="introStart" class="intro-button intro-button-primary" type="button">Start Game</button>
                </div>

                <div id="introControlsPanel" class="intro-panel intro-controls-panel" hidden>
                    <h2 class="intro-subtitle">Choose Controls</h2>
                    <div id="keyboardOptions" class="keyboard-options" aria-label="Keyboard layouts"></div>
                    <button id="introConfirm" class="intro-button intro-button-primary" type="button">Confirm</button>
                </div>

                <div id="introCountdownPanel" class="intro-panel intro-countdown-panel" hidden>
                    <p class="intro-kicker">Get ready</p>
                    <div id="introCountdown" class="intro-countdown">3</div>
                </div>
            </div>
            <div id="gameOverHud" class="game-over-hud" hidden role="dialog" aria-modal="true" aria-labelledby="gameOverTitle">
                <div class="game-over-panel">
                    <h1 id="gameOverTitle" class="game-over-title">You Lost</h1>
                    <div class="game-over-actions" aria-label="Game over actions">
                        <button id="retryLevel" class="game-over-button" type="button">Retry Level</button>
                        <button id="startOver" class="game-over-button game-over-button-secondary" type="button">Start Over</button>
                    </div>
                </div>
            </div>
        </section>
        
        <aside id="devTools" class="devtools" aria-label="Developer tools"></aside>
    </main>
</body>
</html>
